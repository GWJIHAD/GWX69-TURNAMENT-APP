<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin HQ - KheloBD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet">

    <style>
        :root {
            --primary: #0052ff;
            --bg-dark: #08080c;
            --card-bg: #12121a;
            --border: #1a1a28;
            --text-main: #FFFFFF;
            --text-muted: #8f92a1;
            --success: #00e676;
            --danger: #ff3d71;
            --warning: #ffbb33;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 80px; min-height: 100vh; }

        .admin-header { background: rgba(8, 8, 12, 0.85); padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); backdrop-filter: blur(12px); }
        .admin-logo { font-weight: 800; font-size: 22px; display: flex; align-items: center; gap: 8px; }
        .logo-dot { width: 10px; height: 10px; background: var(--primary); border-radius: 50%; }

        .section { display: none; padding: 24px; }
        .section.active { display: block; }

        .stat-card { background: linear-gradient(135deg, #0052ff, #0032a0); padding: 30px; border-radius: 24px; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.1); }
        .stat-val { font-size: 42px; font-weight: 800; }
        .stat-lbl { font-size: 14px; opacity: 0.9; margin-top: 5px; }

        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 15px; }
        .dash-item { background: var(--card-bg); padding: 24px; border-radius: 20px; text-align: center; border: 1px solid var(--border); cursor: pointer; }
        .dash-icon-box { width: 50px; height: 50px; border-radius: 16px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 24px; background: rgba(0,82,255,0.15); color: var(--primary); }

        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #08080c; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .pin-title { margin-bottom: 30px; font-weight: 800; font-size: 20px; color: var(--primary); text-transform: uppercase; }
        .pin-dots { display: flex; gap: 20px; margin-bottom: 50px; }
        .dot { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,0.1); }
        .dot.filled { background: var(--primary); }
        .numpad { display: grid; grid-template-columns: repeat(3, 85px); gap: 25px; }
        .num-key { width: 85px; height: 85px; border-radius: 50%; background: rgba(255,255,255,0.05); display: flex; justify-content: center; align-items: center; font-size: 26px; font-weight: 700; color: white; cursor: pointer; border: 1px solid var(--border); }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="pin-title">SECURITY ACCESS</div>
        <div class="pin-dots" id="pin-dots">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="numpad">
            <div class="num-key" onclick="typePin(1)">1</div>
            <div class="num-key" onclick="typePin(2)">2</div>
            <div class="num-key" onclick="typePin(3)">3</div>
            <div class="num-key" onclick="typePin(4)">4</div>
            <div class="num-key" onclick="typePin(5)">5</div>
            <div class="num-key" onclick="typePin(6)">6</div>
            <div class="num-key" onclick="typePin(7)">7</div>
            <div class="num-key" onclick="typePin(8)">8</div>
            <div class="num-key" onclick="typePin(9)">9</div>
            <div class="num-key" style="background:transparent; border:none;"></div>
            <div class="num-key" onclick="typePin(0)">0</div>
            <div class="num-key" onclick="delPin()" style="color:var(--danger)"><i class="fas fa-backspace"></i></div>
        </div>
    </div>

    <div class="admin-header">
        <div class="admin-logo"><div class="logo-dot"></div> KHELO.ADMIN</div>
        <div onclick="location.reload()" style="cursor:pointer; color:var(--danger);"><i class="fas fa-power-off"></i></div>
    </div>

    <section id="sec-dashboard" class="section active">
        <div class="stat-card">
            <div class="stat-val" id="stat-users">0</div>
            <div class="stat-lbl">Total Registered Users</div>
        </div>
        <div class="dash-grid">
            <div class="dash-item" onclick="alert('Module available soon')">
                <div class="dash-icon-box"><i class="fas fa-gamepad"></i></div>
                <div style="font-weight:700;">Matches</div>
            </div>
            <div class="dash-item" onclick="alert('Module available soon')">
                <div class="dash-icon-box"><i class="fas fa-wallet"></i></div>
                <div style="font-weight:700;">Withdrawals</div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDya0Jd6XkK0db6tDMU-V7xM7dy5gKBk4k",
          authDomain: "ai-turnament-app.firebaseapp.com",
          databaseURL: "https://ai-turnament-app-default-rtdb.firebaseio.com",
          projectId: "ai-turnament-app",
          storageBucket: "ai-turnament-app.firebasestorage.app",
          messagingSenderId: "478532172993",
          appId: "1:478532172993:web:1f0d1a00796aaf2cdd6840",
          measurementId: "G-PVHFQFF7NQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let currentAdminPin = "1234";

        onValue(ref(db, 'app_settings/admin_pin'), s => {
            if(s.exists()) currentAdminPin = String(s.val());
        });

        let pin = "";
        window.typePin = (n) => {
            if(pin.length < 4) {
                pin += n;
                updateDots();
            }
            if(pin === currentAdminPin) { 
                document.getElementById('auth-overlay').style.display = 'none';
                initAdmin();
            } else if (pin.length === 4) {
                setTimeout(() => { if(pin !== currentAdminPin) { pin = ""; updateDots(); } }, 300);
            }
        };
        window.delPin = () => { pin = pin.slice(0, -1); updateDots(); };
        
        function updateDots() {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((d, i) => {
                if(i < pin.length) d.classList.add('filled');
                else d.classList.remove('filled');
            });
        }

        function initAdmin() {
            onValue(ref(db, 'users'), s => {
                if(s.exists()) {
                    document.getElementById('stat-users').innerText = Object.keys(s.val()).length;
                }
            });
        }
    </script>
</body>
</html>
